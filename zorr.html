<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motivatsiya kutubxonasi | @azimmotivate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a14;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--fg:#f6f6ff;--mut:#aaaccb;--g1:#ff9a3d;--g2:#ff3d6e;--g3:#7c5cff;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ff;--card:rgba(25,15,70,.06);--line:rgba(25,15,70,.16);--fg:#171233;--mut:#625e86}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
main{max-width:500px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:Unbounded,Manrope,sans-serif;font-size:22px;margin:0;text-align:center;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 14px;font:800 13px Manrope,system-ui,sans-serif;cursor:pointer}
.chip.on{border-color:transparent;background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff}
.tx{position:relative;margin-top:6px;border-radius:28px;padding:34px 24px;min-height:300px;display:flex;flex-direction:column;justify-content:center;color:#fff;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.35);transition:background .5s}
.tx p{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:20px;line-height:1.6;margin:0;text-shadow:0 2px 14px rgba(0,0,0,.35);animation:in .5s both}
.tx small{margin-top:20px;opacity:.8;font-weight:800;font-size:12px;letter-spacing:.5px}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:14px 4px;font:800 14px Manrope,system-ui,sans-serif;cursor:pointer}
.row button:active{transform:scale(.97)}
.btn{width:100%;margin-top:12px;border:0;border-radius:18px;padding:16px;font:800 16px Manrope,system-ui,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));box-shadow:0 10px 26px rgba(255,61,110,.4)}
.gate{margin-top:6px;border-radius:24px;padding:28px 20px;text-align:center;background:var(--card);border:1px solid var(--line);line-height:1.6}
.gate .btn{margin-top:14px}
#vm{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:34px 26px;text-align:center;color:#fff;background-size:300% 300%;animation:bg 12s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#vm p{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:clamp(22px,6vw,34px);line-height:1.6;margin:0;max-width:640px;text-shadow:0 3px 20px rgba(0,0,0,.45)}
#vm p.f{animation:in 1s both}
#vm .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;cursor:pointer}
#vm .h{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:12px;opacity:.7;font-weight:800}
#vm .w{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:0;right:0;font-weight:800;opacity:.55;font-size:13px}
footer{text-align:center;margin-top:24px;font-size:12px;color:var(--mut)}footer a{color:var(--g1);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>MOTIVATSIYA KUTUBXONASI</h1>
  <div class="sub">Video matnlar, story va atmosfera uchun tayyor so’zlar</div>
  <div class="chips" id="chips"></div>
  <div id="stage"></div>
  <footer><a href="https://www.instagram.com/azimmotivate/" target="_blank" rel="noopener">@azimmotivate</a> uchun tayyorlandi</footer>
</main>
<div id="vm"><button class="x" id="vx" aria-label="Yopish">✕</button><p id="vt"></p><div class="w" id="vw"></div><div class="h">Ekranga bosing: keyingisi · Yozib olish uchun ekran yozuvini yoqing</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var C=[
{k:'q',n:'🔥 Qat’iyat',g:'linear-gradient(135deg,#ff6a3d,#c21f4a)',t:[
"Hech kim seni qutqarish uchun kelmaydi. Shuning uchun o’zing o’zingning qahramoning bo’l.",
"Qiyinchilik seni to’xtatish uchun emas, kimligingni ko’rsatish uchun keladi.",
"Bugun qilmagan ishing ertaga senga qarz bo’lib qaytadi. Qarzni ko’paytirma.",
"Kuchli odamlar kuchli tug’ilmaydi. Ular har kuni qiyin yo’lni tanlab kuchayadi.",
"Yiqilish uyat emas. Yiqilib, yotib qolish uyat.",
"Maqsading katta bo’lsa, bahonalaring kichik bo’lsin."]},
{k:'i',n:'⏰ Intizom',g:'linear-gradient(135deg,#2563eb,#7c3aed)',t:[
"Motivatsiya kayfiyat bilan keladi va ketadi. Intizom esa kayfiyatsiz ham ishlaydi.",
"Katta natija bir kunda emas, minglab zerikarli takrorlarda yaratiladi.",
"Xohlamasang ham qil. Aynan shu joyda sen boshqalardan ajralib chiqasan.",
"Har kuni o’zingga bergan kichik va’da, bir kun katta ishonchga aylanadi.",
"Rejasiz kun yo’lsiz sayohat kabi. Ertalab bugungi uchta asosiy ishingni yoz.",
"Kechagidan atigi bir foiz yaxshi bo’l. Faqat shuni."]},
{k:'p',n:'💰 Pul va karyera',g:'linear-gradient(135deg,#059669,#0e7490)',t:[
"Pul topish bir mahorat, saqlash ikkinchi, ko’paytirish uchinchi. Birinchisida to’xtab qolma.",
"Bilimga qilingan sarmoya hech qachon zarar ko’rmaydi.",
"Bugun tejagan har bir so’m, ertangi erkinligingning g’ishti.",
"Kimdir senga qiymat bermaydi. Sen o’zingga qiymat yaratasan, ish o’zi keladi.",
"Kichikdan boshla, lekin kattalar kabi intilish bilan ishla.",
"Ishingni sevmasang ham eng yaxshi qil. Keyingi eshik aynan shu yerdan ochiladi."]},
{k:'o',n:'📚 O’qish',g:'linear-gradient(135deg,#f59e0b,#b45309)',t:[
"Bir kitob, bir kurs, bir ustoz. Hayotni o’zgartirish uchun ko’pi shart emas, davomiyligi shart.",
"Kun oxirida telefonda emas, ongingga nimadir qo’shib uxla.",
"Bilmaslik uyat emas. O’rganmaslikka rozi bo’lish uyat.",
"Bugun o’qiganing ertaga sening qurolingga aylanadi.",
"Sekin o’qiyapsanmi? Baribir o’qimayotgan odamdan yuz qadam oldindasan.",
"Xato qilsang, bu darsning narxi. Faqat uni ikki marta to’lama."]},
{k:'s',n:'💪 Sport',g:'linear-gradient(135deg,#dc2626,#7f1d1d)',t:[
"Tana senga berilgan yagona uy. Uni parvarish qil.",
"Charchadingmi? Dam ol, lekin taslim bo’lma.",
"Bugun ter to’kasan, ertaga o’zingga qarab tabassum qilasan.",
"Kuch zalda emas, zalga borishga qaror qilgan lahzada tug’iladi.",
"Birinchi besh daqiqa eng qiyin. Qolgani odatga aylanadi.",
"Og’riq vaqtinchalik. Pushaymon esa uzoq yashaydi."]},
{k:'a',n:'🌙 Atmosfera',g:'linear-gradient(135deg,#0f172a,#312e81,#6d28d9)',t:[
"Tun qanchalik qorong’i bo’lmasin, tong albatta keladi. Faqat uni kutishni bil.",
"Sukunatda eng kuchli fikrlar tug’iladi. Ba’zan jim bo’l va o’zingni tingla.",
"Yomg’ir yog’ar ekan, yer ham yangilanadi. Sen ham yangilanishga haqlisan.",
"Yulduzlar faqat qorong’ida ko’rinadi. Qiyin damlaring seni yoritadi.",
"Dengiz to’lqinsiz bo’lmaydi. Hayot ham. Suzishni o’rgan.",
"Bugun kichik qadam, ertaga yangi manzil. Shoshma, yo’l senga tegishli."]},
{k:'h',n:'😤 Qattiq so’z 18+',g:'linear-gradient(135deg,#111111,#7f1d1d,#ef4444)',adult:1,t:[
"Yana “ertaga boshlayman” deysanmi? Ertaga ham xuddi shu gapni aytasan. Tur-da, bugun qil!",
"Telefonni tashla, la’nati. Hayoting ekranda emas, undan tashqarida.",
"Bahona topishga ketgan vaqtda ishni ikki marta qilib bo’lardingki!",
"Dangasalik bilan do’st bo’lding, endi uning hisobini ham o’zing to’laysan.",
"Sen yig’lab o’tirganingda boshqasi uxlamay ishlayapti. O’zingni yig’ishtir!",
"Jin ursin bahonangni! Natijang kerakmi, unda ish qil."]}
];
var cur=0,idx=0,order=[],ok18=false,fav=[],timer=null,paused=false;
try{fav=JSON.parse(localStorage.getItem('mk1'))||[]}catch(e){}
function sv(){try{localStorage.setItem('mk1',JSON.stringify(fav))}catch(e){}}
function list(){return cur===-1?fav.map(function(t){return{t:t}}).map(function(o){return o.t}):C[cur].t}
function shuffle(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(c){cur=c;idx=0;order=shuffle(list().length);chips();show()}
function chips(){
  var h='';C.forEach(function(c,i){h+='<button class="chip'+(cur===i?' on':'')+'" data-i="'+i+'">'+c.n+'</button>'});
  h+='<button class="chip'+(cur===-1?' on':'')+'" data-i="-1">❤️ Saqlangan ('+fav.length+')</button>';
  $('chips').innerHTML=h;
  $('chips').querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.i;pick(i)})});
}
function bg(){return cur===-1?'linear-gradient(135deg,#be185d,#7c3aed)':C[cur].g}
function show(){
  var st=$('stage');
  if(cur>=0&&C[cur].adult&&!ok18){st.innerHTML='<div class="gate"><div style="font-size:42px">🔞</div><b>Qattiq so’zlar bo’limi</b><br><span style="color:var(--mut);font-size:14px">Bu yerda o’ta qattiq, haqoratli ohangdagi motivatsiya bor. Faqat 18 yoshdan oshganlar uchun.</span><button class="btn" id="y">Men 18 yoshdan oshganman</button></div>';
    $('y').addEventListener('click',function(){ok18=true;show()});return}
  var L=list();
  if(!L.length){st.innerHTML='<div class="gate">Hali saqlangan matn yo’q.<br>Matn ostidagi ❤️ tugmasini bosing.</div>';return}
  var t=L[order[idx%order.length]];
  st.innerHTML='<div class="tx" style="background:'+bg()+'"><p>'+t+'</p><small>@azimmotivate</small></div>'+
   '<div class="row"><button id="pv">◀</button><button id="cp">📋 Nusxa</button><button id="fv">'+(fav.indexOf(t)>-1?'💖':'🤍')+'</button><button id="nx">▶</button></div><button class="btn" id="vb">🎬 Video rejimi</button>';
  $('nx').addEventListener('click',function(){idx++;show()});
  $('pv').addEventListener('click',function(){idx=(idx-1+order.length)%order.length;show()});
  $('cp').addEventListener('click',function(){var b=this,s=t+' — @azimmotivate';
    if(navigator.clipboard)navigator.clipboard.writeText(s).then(function(){b.textContent='✓ Nusxalandi'},function(){});});
  $('fv').addEventListener('click',function(){var i=fav.indexOf(t);if(i>-1)fav.splice(i,1);else fav.push(t);sv();chips();if(cur===-1){order=shuffle(fav.length);idx=0}show()});
  $('vb').addEventListener('click',video);
}
function vshow(){
  var L=list(),t=L[order[idx%order.length]],p=$('vt');
  p.className='';void p.offsetWidth;p.className='f';p.textContent=t;$('vw').textContent=(idx%order.length+1)+' / '+order.length;
}
function video(){
  var v=$('vm');v.style.backgroundImage=bg();v.style.display='flex';
  document.body.style.overflow='hidden';vshow();clearInterval(timer);
  timer=setInterval(function(){if(!paused){idx++;vshow()}},9000);
  try{if(v.requestFullscreen)v.requestFullscreen().catch(function(){})}catch(e){}
}
function stop(){clearInterval(timer);$('vm').style.display='none';document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}show()}
$('vm').addEventListener('click',function(e){if(e.target.id==='vx')return;idx++;vshow()});
$('vx').addEventListener('click',function(e){e.stopPropagation();stop()});
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&$('vm').style.display==='flex')stop()});
pick(0);
})();
</script>
</body>
</html>
